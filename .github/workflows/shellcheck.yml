name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shopt -s globstar
          shellcheck install.sh docker/entrypoint.sh scripts/*.sh orchestrator/*.sh orchestrator/lib/*.sh
